<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timmy auf YouTube</title>
<meta name="theme-color" content="#0f0f0f">
<meta property="og:title" content="Das sind die 9 SCHRECKLICHSTEN Dinge der Welt">
<meta property="og:type" content="video.other">
<script>
  var VIDEO_ID = "0_vEnIf3bIM"; // hier neues Video eintragen
  var web = "https://www.youtube.com/watch?v=" + VIDEO_ID;
  var ua = navigator.userAgent || "";
  var android = /Android/i.test(ua);
  var ios = /iPhone|iPad|iPod/i.test(ua);
  var instagram = /Instagram/i.test(ua);
  var facebook = /FBAN|FBAV/i.test(ua);
  var threads = /Barcelona/i.test(ua);
  var inApp = instagram || facebook || threads;
  var thumb = "https://i.ytimg.com/vi/" + VIDEO_ID + "/maxresdefault.jpg";

  document.write('<meta property="og:image" content="' + thumb + '">');

  // iOS Instagram ignores a scripted jump on load. A meta refresh to
  // instagram://extbrowser is the handoff it still honors (2026): Instagram
  // asks once, then the real browser opens the video and Universal Link
  // starts the YouTube app. Threads uses the same trick with barcelona://.
  if (ios && threads) {
    window.__out = "barcelona://extbrowser/?url=" + encodeURIComponent(web);
    document.write('<meta http-equiv="refresh" content="0;url=' + window.__out + '">');
  } else if (ios && instagram) {
    window.__out = "instagram://extbrowser/?url=" + encodeURIComponent(web);
    document.write('<meta http-equiv="refresh" content="0;url=' + window.__out + '">');
  }
</script>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f0f0f;color:#fff;font-family:system-ui,-apple-system,sans-serif;text-align:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .box{padding:24px;max-width:420px}
  img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#222;border-radius:14px;margin-bottom:18px}
  h1{font-size:22px;line-height:1.25;margin:0 0 18px}
  a.btn{display:block;background:#ff0000;color:#fff;text-decoration:none;font-weight:700;font-size:20px;padding:18px;border-radius:999px}
  p{color:#aaa;font-size:14px;margin:16px 0 0}
</style>
</head>
<body>
<div class="box">
  <img id="thumb" alt="">
  <h1>Das sind die 9 SCHRECKLICHSTEN Dinge der Welt</h1>
  <a class="btn" id="btn" href="#">▶ Auf YouTube ansehen</a>
  <p id="hint">Geht YouTube nicht von allein auf? Tipp einfach auf den Knopf.</p>
  <p id="menu" hidden>Wenn sich nichts tut: oben rechts auf •••, dann auf „In externem Browser öffnen“.</p>
</div>
<script>
  var img = document.getElementById("thumb");
  img.src = thumb;
  img.onerror = function () {
    img.onerror = null;
    img.src = "https://i.ytimg.com/vi/" + VIDEO_ID + "/hqdefault.jpg";
  };

  var app;
  if (android) {
    app = "intent://www.youtube.com/watch?v=" + VIDEO_ID +
          "#Intent;package=com.google.android.youtube;scheme=https;S.browser_fallback_url=" +
          encodeURIComponent(web) + ";end";
  } else if (ios && (instagram || threads) && window.__out) {
    app = window.__out;
  } else if (ios && facebook) {
    app = "x-safari-" + web;
  } else if (ios) {
    app = "youtube://www.youtube.com/watch?v=" + VIDEO_ID;
  } else {
    app = web;
  }

  var btn = document.getElementById("btn");
  btn.href = app;

  if (ios && inApp) {
    document.getElementById("menu").hidden = false;
    document.getElementById("hint").textContent = "Tipp auf den Knopf. Danach kurz bestätigen, dann geht YouTube auf.";
  }

  // A tap is a real gesture, so the button href is enough. Auto-jump only
  // where it is not swallowed: Android intent, normal iOS (youtube://), desktop.
  if (android || !ios) {
    window.location.href = app;
  } else if (!inApp) {
    window.location.href = app;
    stillHere(function () { window.location.href = web; });
  }

  function stillHere(done) {
    var start = Date.now();
    var n = 0;
    var id = setInterval(function () {
      n++;
      var elapsed = Date.now() - start;
      if (document.hidden || elapsed > n * 250 + 900) {
        clearInterval(id);
        return;
      }
      if (elapsed > 2500) {
        clearInterval(id);
        done();
      }
    }, 250);
  }
</script>
</body>
</html>
